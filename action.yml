name: Kineti native evidence gate
description: Check participating CI commands against recorded evidence and reported spending; no protected writes or automatic interception.
inputs:
  executable:
    description: Absolute path to the reviewed installed native kineti executable
    required: true
  required-label:
    description: Required test receipt label
    required: true
runs:
  using: composite
  steps:
    - name: Check required native evidence
      shell: bash
      env:
        KINETI_EXECUTABLE: ${{ inputs.executable }}
        KINETI_REQUIRED_LABEL: ${{ inputs.required-label }}
      run: '"$KINETI_EXECUTABLE" ci --require-evidence "$KINETI_REQUIRED_LABEL"'
