[workspace]
resolver = "2"
members = [
    "crates/kineti-cli",
]

[workspace.package]
version = "0.6.1"
edition = "2021"
authors = ["Kineti Team <hello@getkineti.com>"]
license = "MIT"
readme = "../README.md"
description = "Native checks, receipts, reported-spending gate and registered undo"
homepage = "https://github.com/therawlogs/kineti"
repository = "https://github.com/therawlogs/kineti"

[workspace.dependencies]

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
