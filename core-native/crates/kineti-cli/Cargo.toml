[package]
name = "kineti-cli"
autobins = false
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
description = "Record checks, detect changed inputs, and gate participating CI on evidence and reported spending"

[lints]
workspace = true

[dependencies]
serde_json = { version = "=1.0.149", features = ["preserve_order"] }
ed25519-dalek = "=2.2.0"
base64 = "=0.23.1"
sha2 = "=0.10.9"
time = { version = "=0.3.47", features = ["formatting", "parsing"] }
libc = "0.2"
regex = "=1.12.3"
shell-words = "=1.1.1"
toml = "=0.9.12"

[[bin]]
name = "kineti"
path = "src/gate_main.rs"

# Cargo installs the packaged crate outside this workspace. Keep the same size profile.
[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
