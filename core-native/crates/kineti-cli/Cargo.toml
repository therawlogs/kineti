[package]
name = "kineti-cli"
autobins = false
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Record checks, detect changed inputs, and gate participating CI on evidence and reported spending"

[lints]
workspace = true

[dependencies]
serde_json = { version = "=1.0.154", features = ["preserve_order"] }
ed25519-dalek = "=3.0.0"
base64 = "=0.23.1"
sha2 = "=0.11.1"
time = { version = "=0.3.55", features = ["formatting", "parsing"] }
libc = "0.2"
regex = "=1.13.1"
shell-words = "=1.1.1"
toml = "=1.2.2"

[[bin]]
name = "kineti"
path = "src/gate_main.rs"
