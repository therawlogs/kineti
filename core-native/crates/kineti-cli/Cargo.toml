[package]
name = "kineti-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
description = "Native CLI and server runner for Kineti AI assistant"

[lints]
workspace = true

[dependencies]
kineti-core = { path = "../kineti-core", version = "0.5.0" }
kineti-reflex = { path = "../kineti-reflex", version = "0.5.0" }
kineti-memory = { path = "../kineti-memory", version = "0.5.0" }
kineti-connectors = { path = "../kineti-connectors", version = "0.5.0" }
kineti-actions = { path = "../kineti-actions", version = "0.5.0" }
kineti-gateway = { path = "../kineti-gateway", version = "0.5.0" }
serde_json = { version = "=1.0.149", features = ["preserve_order"] }
ed25519-dalek = "=2.2.0"
base64 = "=0.22.1"
sha2 = "=0.10.9"
time = { version = "=0.3.47", features = ["formatting", "parsing"] }
libc = "0.2"
regex = "=1.12.3"
shell-words = "=1.1.1"
toml = "=0.9.12"

[[bin]]
name = "kineti"
path = "src/gate_main.rs"

[[bench]]
name = "benchmarks"
harness = false
path = "benches/benchmarks.rs"
