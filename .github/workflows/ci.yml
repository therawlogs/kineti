name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # §R1 one-code-path rule: identical suite under every backend.
        # Phase 1: ipc tests spawn a real kinetid regardless of axis;
        # callers migrate onto select_spend/JournalWriter in Phases 2-3.
        backend: [direct, daemon]
    env:
      KINETI_FORCE_DIRECT: ${{ matrix.backend == 'daemon' && '' || '1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo build
        # phase9 asserts exported symbols in target/debug/libkineti.{dylib,so};
        # `cargo test` alone leaves the cdylib only under deps/
      - run: cargo test --all
      - run: cargo clippy --all-targets -- -D warnings
      - name: size gate (hard, ETHOS budget <10MB)
        run: |
          cargo build --release
          ./scripts/size-gate.sh

  release-linux:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            asset: kineti-linux-x64
          - target: aarch64-unknown-linux-gnu
            asset: kineti-linux-arm64
          # static builds: zero dyld on servers/CI — install.sh prefers these
          - target: x86_64-unknown-linux-musl
            asset: kineti-linux-x64-static
          - target: aarch64-unknown-linux-musl
            asset: kineti-linux-arm64-static
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - name: stage asset
        run: cp "target/${{ matrix.target }}/release/kineti" "${{ matrix.asset }}"
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}

  release-macos:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            asset: kineti-darwin-arm64
          - target: x86_64-apple-darwin
            asset: kineti-darwin-x64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - name: stage asset
        run: cp "target/${{ matrix.target }}/release/kineti" "${{ matrix.asset }}"
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}

  # Aggregate SHA256SUMS for every published binary so install.sh can verify
  # downloads before executing them.
  release-checksums:
    needs: [release-linux, release-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: download all release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"              --dir assets --clobber
      - name: generate SHA256SUMS
        working-directory: assets
        run: sha256sum * > ../SHA256SUMS
      - name: upload SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber

  # C-ABI consumers need the header; publish it alongside every release.
  release-header:
    needs: [release-checksums]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" include/kineti.h --repo "$GITHUB_REPOSITORY" --clobber

  # getkineti.com contract (docs/RELEASE.md): the domain serves install.sh
  # byte-identical to main. Whenever install.sh changes on a green main,
  # mirror it into therawlogs/kineti-website/public/install.sh so Vercel
  # redeploys. Weekly domain-smoke verifies the served bytes independently.
  sync-install-sh:
    name: sync install.sh to website
    needs: [test]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: push install.sh to kineti-website when bytes differ
        env:
          TOKEN: ${{ secrets.WEBSITE_REPO_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          [ -n "${TOKEN:-}" ] || { echo "::error::WEBSITE_REPO_TOKEN secret not set — create a fine-grained PAT with Contents:RW on kineti-website only (docs/RELEASE.md)"; exit 1; }
          api="https://api.github.com/repos/therawlogs/kineti-website/contents/public/install.sh"
          lsha=$(sha256sum install.sh | cut -d' ' -f1)
          remote=$(curl -fsSL -H "Authorization: Bearer $TOKEN" "$api" 2>/dev/null || echo '{}')
          rsha=$(printf '%s' "$remote" | jq -r '.sha // empty')
          # hash the DECODED bytes from a file: command substitution would
          # strip the trailing newline and break byte-identity comparison
          tmp=$(mktemp); trap 'rm -f "$tmp"' EXIT
          if printf '%s' "$remote" | jq -r '.content // empty' | base64 -d > "$tmp" 2>/dev/null \
             && [ "$(sha256sum "$tmp" | cut -d' ' -f1)" = "$lsha" ]; then
            echo "already in sync — no deploy needed"; exit 0
          fi
          b64=$(base64 -w0 install.sh)
          put() {
            jq -n --arg msg "sync install.sh from therawlogs/kineti@${SHA:0:8}" \
                  --arg content "$b64" --arg sha "${1:-}" \
                  '{message:$msg, content:$content} + (if $sha != "" then {sha:$sha} else {} end)' \
            | curl -sS -o /tmp/put.json -w '%{http_code}' -X PUT \
                -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" \
                "$api" -d @-
          }
          code=$(put "$rsha")
          if [ "$code" = "409" ]; then   # raced a concurrent update: refetch sha, retry once
            rsha=$(curl -fsSL -H "Authorization: Bearer $TOKEN" "$api" | jq -r '.sha')
            code=$(put "$rsha")
          fi
          [ "$code" = "200" ] || { cat /tmp/put.json; exit 1; }
          echo "pushed public/install.sh ($(wc -c < install.sh | tr -d ' ') bytes) at ${SHA:0:8} — Vercel will redeploy"
