name: Native gate 0.6.0 candidates
on:
  push:
    branches: [codex/gate-060]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-gate-candidates-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native:
    if: github.event.repository.visibility == 'public'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, key: linux-x64, triple: x86_64-unknown-linux-musl}
          - {runner: ubuntu-24.04-arm, key: linux-arm64, triple: aarch64-unknown-linux-musl}
          - {runner: macos-15-intel, key: darwin-x64, triple: x86_64-apple-darwin}
          - {runner: macos-15, key: darwin-arm64, triple: aarch64-apple-darwin}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          targets: ${{ matrix.triple }}
          components: rustfmt, clippy
      - name: Prepare native musl linker
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y musl-tools
          echo CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc >> "$GITHUB_ENV"
          echo CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc >> "$GITHUB_ENV"
      - name: Format, lint and actual native tests in both timezones
        run: |
          mkdir -p .kineti/native-artifacts
          python3 scripts/native-runner-identity.py > .kineti/native-artifacts/runner.json
          node scripts/test-native-installer.cjs
          cargo fmt --manifest-path core-native/Cargo.toml --check
          cargo clippy --locked --manifest-path core-native/Cargo.toml --all-targets -- -D warnings
          TZ=UTC cargo test --locked --manifest-path core-native/Cargo.toml 2>&1 | tee .kineti/native-artifacts/tests-utc.log
          TZ=Asia/Kolkata cargo test --locked --manifest-path core-native/Cargo.toml 2>&1 | tee .kineti/native-artifacts/tests-kolkata.log
      - name: Build exact native candidate and record fresh test evidence
        env:
          TARGET: ${{ matrix.triple }}
          KEY: ${{ matrix.key }}
        run: |
          cargo build --release --locked --manifest-path core-native/Cargo.toml --target "$TARGET"
          mkdir -p .kineti/native-artifacts
          cp "core-native/target/$TARGET/release/kineti" ".kineti/native-artifacts/kineti-$KEY"
          GATE="$PWD/core-native/target/$TARGET/release/kineti"
          "$GATE" init --goal "Build universal agent harness with cryptographic verification" --codex-home "$PWD/.kineti/ci-codex" --apply
          TZ=UTC "$GATE" test run --label native-utc --timeout 600 --required-test core-native/crates/kineti-cli/tests -- cargo test --locked --manifest-path core-native/Cargo.toml
          TZ=UTC "$GATE" test check --label native-utc
          TZ=Asia/Kolkata "$GATE" test run --label native-kolkata --timeout 600 --required-test core-native/crates/kineti-cli/tests -- cargo test --locked --manifest-path core-native/Cargo.toml
          TZ=Asia/Kolkata "$GATE" test check --label native-kolkata
          cp .kineti/evidence.jsonl .kineti/native-artifacts/evidence.jsonl
          cp .kineti/evidence-issuer.pem .kineti/native-artifacts/evidence-issuer.pem
      - name: Package the sole crate
        if: matrix.key == 'linux-x64'
        run: |
          cargo package --locked --manifest-path core-native/crates/kineti-cli/Cargo.toml
          cp core-native/target/package/kineti-cli-0.6.0.crate .kineti/native-artifacts/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-${{ matrix.key }}
          path: .kineti/native-artifacts/
          include-hidden-files: true
          retention-days: 1
  package:
    needs: native
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: native-*
          merge-multiple: true
          path: .kineti/native-artifacts
      - run: python3 scripts/build-native-package.py --artifacts .kineti/native-artifacts --output .kineti/packages
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-candidate-packages
          path: .kineti/packages
          include-hidden-files: true
          retention-days: 1
  install:
    needs: package
    if: github.event.repository.visibility == 'public'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, key: linux-x64, triple: x86_64-unknown-linux-musl}
          - {runner: ubuntu-24.04-arm, key: linux-arm64, triple: aarch64-unknown-linux-musl}
          - {runner: macos-15-intel, key: darwin-x64, triple: x86_64-apple-darwin}
          - {runner: macos-15, key: darwin-arm64, triple: aarch64-apple-darwin}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          targets: ${{ matrix.triple }}
      - name: Prepare native musl linker
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y musl-tools
          echo CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc >> "$GITHUB_ENV"
          echo CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: native-candidate-packages
          path: .kineti/packages
      - run: python3 scripts/accept-native-install.py --artifacts .kineti/packages --target '${{ matrix.key }}' --rust-target '${{ matrix.triple }}' --work-root "$RUNNER_TEMP/kineti-install-acceptance"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: installed-${{ matrix.key }}
          path: ${{ runner.temp }}/kineti-install-acceptance/${{ matrix.key }}/report.json
          include-hidden-files: true
          retention-days: 1
# Deliberately no publishing jobs or tag triggers. Publication needs separate
# reviewed-artifact approval and accounting policy acceptance.
