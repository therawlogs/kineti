name: Kineti Outcome Verification Gate

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  verify:
    name: Causal Outcome Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Dependencies
        run: bun install

      - name: Seed CI runtime state
        run: bun scripts/ci-seed.ts

      - name: Router codegen freshness
        run: |
          bun run build:router
          git diff --exit-code -- bin/kineti.js

      - name: Run Type Integrity Check
        run: bun bin/kineti-evidence.ts run --label gate-typecheck --timeout 300 -- bun run typecheck

      - name: Rust formatting check
        run: cargo fmt --all --manifest-path core-native/Cargo.toml --check

      - name: Rust lint check
        run: cargo clippy --all-targets --manifest-path core-native/Cargo.toml -- -D warnings

      - name: Run Unit & Gate Test Suite
        run: bun bin/kineti-evidence.ts run --label gate-ts-tests --timeout 600 -- bun test tests/

      - name: Run Rust Engine Test Suite
        run: bun bin/kineti-evidence.ts run --label gate-rust-tests --timeout 900 -- cargo test --manifest-path core-native/Cargo.toml

      - name: Run Installer Smoke Test
        run: bun bin/kineti-evidence.ts run --label gate-installer-smoke --timeout 600 -- bun run test:setup

      - name: Verify every evidence record is fresh
        if: always()
        run: |
          set -e
          for label in gate-typecheck gate-ts-tests gate-rust-tests gate-installer-smoke; do
            bun bin/kineti-evidence.ts check --label "$label"
          done

      - name: Verify Kineti State & Evidence Gate
        id: kineti_gate
        if: always()
        run: |
          bun bin/kineti-ci.ts --pr-comment-file pr_comment.md

      - name: Post PR Verification Badge
        if: github.event_name == 'pull_request' && (success() || failure())
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '';
            try {
              body = fs.readFileSync('pr_comment.md', 'utf8');
            } catch (e) {
              body = '### 🛡️ Kineti Verification Gate\nFailed to read verification report.';
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c => c.body.includes('Context Integrity Verification'));

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }
