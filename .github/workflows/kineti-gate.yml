name: Kineti Outcome Verification Gate

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  verify:
    name: Causal Outcome Verification
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      pr_comment_b64: ${{ steps.comment.outputs.body_b64 }}
    env:
      KINETI_REQUIRED_EVIDENCE: gate-typecheck gate-ts-tests gate-rust-tests gate-cli-selfcheck gate-installer-smoke

    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy

      - name: Install Dependencies
        run: bun install

      - name: Router codegen freshness
        run: |
          bun run build:router
          git diff --exit-code -- bin/kineti.js

      - name: Seed CI runtime state
        run: bun bin/kineti.js seed

      - name: Run Type Integrity Check
        run: bun bin/kineti-evidence.ts run --label gate-typecheck --timeout 300 -- bun run typecheck

      - name: Rust formatting check
        run: cargo fmt --all --manifest-path core-native/Cargo.toml --check

      - name: Rust lint check
        run: cargo clippy --all-targets --manifest-path core-native/Cargo.toml -- -D warnings

      - name: Run Unit & Gate Test Suite
        run: bun bin/kineti-evidence.ts run --label gate-ts-tests --timeout 600 -- bun test tests/

      - name: Run Rust Engine Test Suite
        run: bun bin/kineti-evidence.ts run --label gate-rust-tests --timeout 900 -- cargo test --manifest-path core-native/Cargo.toml

      - name: Run Native CLI Self-Check
        run: bun bin/kineti-evidence.ts run --label gate-cli-selfcheck --timeout 600 -- cargo run -p kineti-cli -- test-all

      - name: Run Installer Smoke Test
        run: bun bin/kineti-evidence.ts run --label gate-installer-smoke --timeout 600 -- bun run test:setup

      - name: Verify every evidence record is fresh
        if: always()
        run: |
          set -e
          read -r -a labels <<< "$KINETI_REQUIRED_EVIDENCE"
          for label in "${labels[@]}"; do
            bun bin/kineti-evidence.ts check --label "$label"
          done

      - name: Verify Egress Ledger Integrity
        run: bun bin/kineti-egress.ts verify

      - name: Verify Kineti State & Evidence Gate
        id: kineti_gate
        if: always()
        run: |
          read -r -a labels <<< "$KINETI_REQUIRED_EVIDENCE"
          args=()
          for label in "${labels[@]}"; do args+=(--require-evidence "$label"); done
          bun bin/kineti.js ci "${args[@]}" --pr-comment-file pr_comment.md

      - name: Prepare PR report output
        id: comment
        if: always()
        run: |
          if [ -f pr_comment.md ]; then
            body_b64="$(base64 -w 0 pr_comment.md)"
          else
            body_b64="$(printf '%s\n' '### Kineti CI Checks: BLOCKED' 'The verification report could not be created.' | base64 -w 0)"
          fi
          printf 'body_b64=%s\n' "$body_b64" >> "$GITHUB_OUTPUT"

  report:
    name: Post PR CI report
    needs: verify
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Post PR CI report
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          PR_COMMENT_B64: ${{ needs.verify.outputs.pr_comment_b64 }}
        with:
          script: |
            const encoded = process.env.PR_COMMENT_B64 || '';
            const body = encoded
              ? Buffer.from(encoded, 'base64').toString('utf8').slice(0, 60000)
              : '### Kineti CI Checks: BLOCKED\nThe verification report was missing.';

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c => c.user?.type === 'Bot' && c.body.includes('Kineti CI Checks'));

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }
