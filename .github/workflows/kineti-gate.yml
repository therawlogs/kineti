name: Kineti Outcome Verification Gate

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  verify:
    name: Causal Outcome Verification
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      pr_comment_b64: ${{ steps.comment.outputs.body_b64 }}
    env:
      KINETI_REQUIRED_EVIDENCE: gate-ts-tests gate-rust-tests

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy

      - name: Install Dependencies
        run: bun install

      - name: Router codegen freshness
        run: |
          bun run build:router
          git diff --exit-code -- bin/kineti.js

      - name: Seed CI runtime state
        run: bun bin/kineti.js seed

      - name: Run Type Integrity Check
        run: bun run typecheck

      - name: Rust formatting check
        run: cargo fmt --all --manifest-path core-native/Cargo.toml --check

      - name: Rust lint check
        run: cargo clippy --all-targets --manifest-path core-native/Cargo.toml -- -D warnings

      - name: Run Unit & Gate Test Suite
        run: bun bin/kineti-evidence.ts run --label gate-ts-tests --required-test tests --timeout 600 -- bun test tests/

      - name: Run Rust Engine Test Suite
        run: bun bin/kineti-evidence.ts run --label gate-rust-tests --required-test core-native/crates --timeout 900 -- cargo test --manifest-path core-native/Cargo.toml

      - name: Run Native CLI Self-Check
        run: cargo run --manifest-path core-native/Cargo.toml -p kineti-cli -- test-all

      - name: Run Installer Smoke Test
        run: bun run test:setup

      - name: Verify every evidence record is fresh
        if: always()
        run: |
          set -e
          read -r -a labels <<< "$KINETI_REQUIRED_EVIDENCE"
          for label in "${labels[@]}"; do
            bun bin/kineti-evidence.ts check --label "$label"
          done

      - name: Verify Egress Ledger Integrity
        run: bun bin/kineti-egress.ts verify

      - name: Verify Kineti State & Evidence Gate
        id: kineti_gate
        if: always()
        run: |
          read -r -a labels <<< "$KINETI_REQUIRED_EVIDENCE"
          args=()
          for label in "${labels[@]}"; do args+=(--require-evidence "$label"); done
          bun bin/kineti.js ci "${args[@]}" --pr-comment-file .kineti/pr_comment.md

      - name: Prepare PR report output
        id: comment
        if: always()
        run: |
          if [ -f .kineti/pr_comment.md ]; then
            body_b64="$(base64 -w 0 .kineti/pr_comment.md)"
          else
            body_b64="$(printf '%s\n' '### Kineti CI Checks: BLOCKED' 'The verification report could not be created.' | base64 -w 0)"
          fi
          printf 'body_b64=%s\n' "$body_b64" >> "$GITHUB_OUTPUT"

  report:
    name: Post PR CI report
    needs: verify
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Post PR CI report
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_COMMENT_B64: ${{ needs.verify.outputs.pr_comment_b64 }}
          PR_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const marker = '<!-- kineti-ci-report:v1 -->';
            const expectedAuthor = 'github-actions[bot]';
            const expectedHead = process.env.PR_EXPECTED_HEAD || '';
            const encoded = process.env.PR_COMMENT_B64 || '';
            const target = { owner: context.repo.owner, repo: context.repo.repo, pull_number: context.issue.number };
            try {
              if (!/^[a-f0-9]{40,64}$/.test(expectedHead)) throw new Error('missing expected PR head');
              const initial = await github.rest.pulls.get(target);
              let state = initial.data.head.sha === expectedHead ? 'current' : 'stale';
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: target.owner, repo: target.repo, issue_number: target.pull_number, per_page: 100,
              });
              const existing = comments.find(c => c.user?.login === expectedAuthor && typeof c.body === 'string' && c.body.startsWith(marker));
              const latest = await github.rest.pulls.get(target);
              if (latest.data.head.sha !== expectedHead) state = 'stale';
              const report = encoded ? Buffer.from(encoded, 'base64').toString('utf8').slice(0, 58000) : '';
              if (!report && state === 'current') state = 'error';
              const content = state === 'current' ? report : state === 'stale'
                ? 'STALE: this report evaluated an older PR head. It cannot authorize the current head.'
                : 'ERROR: the verification report was missing. No success is established.';
              const body = `${marker}\n<!-- evaluated-head:${expectedHead} state:${state} -->\n${content}`;
              const destination = { owner: target.owner, repo: target.repo, body };
              if (existing) await github.rest.issues.updateComment({ ...destination, comment_id: existing.id });
              else await github.rest.issues.createComment({ ...destination, issue_number: target.pull_number });
              if (state !== 'current') core.setFailed(`Kineti report is ${state}`);
            } catch (error) {
              core.setFailed(`ERROR: PR report could not be checked or written: ${error.message}`);
              throw error;
            }

  consumer-acceptance:
    name: Pinned reusable Action acceptance
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/kineti-completion-20261021'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      KINETI_CLIENT_PROJECT: ${{ runner.temp }}/kineti-disposable-caller
      KINETI_MACHINE_DIR: ${{ runner.temp }}/kineti-disposable-caller/.kineti/machine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.0'
      - name: Provision disposable owner service
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap busybox-static musl
          sudo env KINETI_CALLER_UID="$(id -u)" KINETI_CALLER_GID="$(id -g)" KINETI_CLIENT_PROJECT="$KINETI_CLIENT_PROJECT" "$(command -v bun)" acceptance/github-provision.ts
          service_root="$(cat .kineti/github-input/service-root.txt)"
          sudo "$(command -v bun)" bin/kineti-linux-service.ts serve "$service_root" 17889 > .kineti/github-service.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -s -o /dev/null http://127.0.0.1:17889/; then break; fi
            sleep 1
          done
      - name: Authentic candidate succeeds through pinned reusable Action
        uses: therawlogs/kineti@9261aaa53b860d1184bf6d094261032eacae1de0
        with:
          trusted-commit: 9261aaa53b860d1184bf6d094261032eacae1de0
          client-project: ${{ env.KINETI_CLIENT_PROJECT }}
          manifest: ${{ github.workspace }}/.kineti/github-input/manifest.json
          artifact: ${{ github.workspace }}/.kineti/github-input/candidate.sh
      - name: Substitute candidate bytes
        run: sudo sh -c 'printf "substituted\n" > .kineti/github-input/candidate.sh'
      - name: Substitution must fail
        id: substitution
        continue-on-error: true
        uses: therawlogs/kineti@9261aaa53b860d1184bf6d094261032eacae1de0
        with:
          trusted-commit: 9261aaa53b860d1184bf6d094261032eacae1de0
          client-project: ${{ env.KINETI_CLIENT_PROJECT }}
          manifest: ${{ github.workspace }}/.kineti/github-input/manifest.json
          artifact: ${{ github.workspace }}/.kineti/github-input/candidate.sh
      - name: Check denial and record summary
        env:
          SUBSTITUTION_OUTCOME: ${{ steps.substitution.outcome }}
        run: |
          test "$SUBSTITUTION_OUTCOME" = failure
          printf '%s\n' 'Pinned reusable Action accepted exact approved bytes and rejected substitution.' >> "$GITHUB_STEP_SUMMARY"
