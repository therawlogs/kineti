name: Native gate checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path core-native/Cargo.toml --check
      - run: cargo clippy --locked --manifest-path core-native/Cargo.toml --all-targets -- -D warnings
      - run: TZ=UTC cargo test --locked --manifest-path core-native/Cargo.toml
      - run: TZ=Asia/Kolkata cargo test --locked --manifest-path core-native/Cargo.toml
