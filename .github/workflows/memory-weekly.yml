name: Memory Ledger Weekly Check

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  memory-check:
    name: Verify memory chain (read-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - run: bun install

      - name: Verify memory hash chain
        run: bun bin/kineti-memory-job.ts verify-chain

      - name: Verify memory time order
        run: bun bin/kineti-memory-job.ts time-order
