name: Published 0.6.1 exact-archive acceptance

on:
  workflow_dispatch:
    inputs:
      expected_cargo_sha256:
        description: "Exact separately approved SHA-256 of kineti-cli-0.6.1.crate"
        type: string
        required: true
      expected_npm_sha256:
        description: "Exact separately approved SHA-256 of kineti-0.6.1.tgz"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: published-061-acceptance-${{ github.ref }}
  cancel-in-progress: false

# Manual verification after separately approved publication. This workflow only
# reads registries and installs exact version names; it cannot publish or deploy.
# Digest inputs bind bytes; providing them proves neither human identity nor
# publication approval. Dispatch remains separate from the approval decision.
# Standard public runners/included one-day artifact storage only. Keep the hard
# zero-spend stop unchanged; quota exhaustion is a failure, never a paid fallback.
jobs:
  installed:
    if: github.event.repository.visibility == 'public'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, key: linux-x64, triple: x86_64-unknown-linux-musl, os: Linux, machine: x86_64}
          - {runner: ubuntu-24.04-arm, key: linux-arm64, triple: aarch64-unknown-linux-musl, os: Linux, machine: aarch64}
          - {runner: macos-15-intel, key: darwin-x64, triple: x86_64-apple-darwin, os: Darwin, machine: x86_64}
          - {runner: macos-15, key: darwin-arm64, triple: aarch64-apple-darwin, os: Darwin, machine: arm64}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          targets: ${{ matrix.triple }}
      - name: Prepare native musl linker
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y musl-tools
          echo CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc >> "$GITHUB_ENV"
          echo CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc >> "$GITHUB_ENV"
      - name: Verify approved archive bytes and actual published registry installs
        env:
          TARGET_KEY: ${{ matrix.key }}
          RUST_TARGET: ${{ matrix.triple }}
          EXPECTED_OS: ${{ matrix.os }}
          EXPECTED_MACHINE: ${{ matrix.machine }}
          EXPECTED_CARGO_SHA256: ${{ inputs.expected_cargo_sha256 }}
          EXPECTED_NPM_SHA256: ${{ inputs.expected_npm_sha256 }}
        run: |
          set -euo pipefail
          python3 - <<'PYPUBLISHED'
          import hashlib, json, os, platform, subprocess, sys
          from pathlib import Path
          root = Path.cwd()
          assert platform.system() == os.environ["EXPECTED_OS"], "wrong actual published-install runner OS"
          assert platform.machine() == os.environ["EXPECTED_MACHINE"], "wrong actual published-install runner architecture"
          assert subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip() == os.environ["GITHUB_SHA"]
          env = dict(os.environ, HOME=str(root / ".kineti/published-061-home"), CODEX_HOME=str(root / ".kineti/published-061-codex"),
                     CARGO_HOME=str(root / ".kineti/published-061-cargo"), npm_config_cache=str(root / ".kineti/published-061-npm-cache"),
                     RUSTUP_HOME=os.environ.get("RUSTUP_HOME", str(Path.home() / ".rustup")))
          for name in ["HOME", "CODEX_HOME", "CARGO_HOME", "npm_config_cache"]:
              Path(env[name]).mkdir(parents=True, exist_ok=True)
          work = Path(os.environ["RUNNER_TEMP"]) / "kineti-published-061-acceptance"
          argv = [sys.executable, "scripts/accept-native-install.py", "--published-registry", "--artifacts", ".kineti/published-061/packages",
                  "--expected-cargo-sha256", os.environ["EXPECTED_CARGO_SHA256"], "--expected-npm-sha256", os.environ["EXPECTED_NPM_SHA256"],
                  "--target", os.environ["TARGET_KEY"], "--rust-target", os.environ["RUST_TARGET"], "--work-root", str(work)]
          subprocess.run(argv, env=env, check=True, timeout=1500)
          report_path = work / os.environ["TARGET_KEY"] / "report.json"
          report = json.loads(report_path.read_text())
          report.update(actual_runner=json.loads(subprocess.check_output([sys.executable, "scripts/native-runner-identity.py"], env=env, text=True)),
                        acceptance_kind="exact published 0.6.1 registry packages; no publication authority",
                        acceptance_script_sha256=hashlib.sha256((root / "scripts/accept-native-install.py").read_bytes()).hexdigest())
          assert report["installation_source"] == "published registry names"
          assert report["cargo_registry_cached_crate_verified"] and report["npm_installed_payload_and_assets_match_reviewed_archive"]
          report_path.write_text(json.dumps(report, indent=2) + "\n")
          print(json.dumps(report, indent=2), flush=True)
          PYPUBLISHED
      - name: Preserve allowlisted acceptance reports and inventories
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: published-061-${{ matrix.key }}
          path: |
            ${{ runner.temp }}/kineti-published-061-acceptance/${{ matrix.key }}/report.json
            ${{ runner.temp }}/kineti-published-061-acceptance/${{ matrix.key }}/cargo-installed-inventory.json
            ${{ runner.temp }}/kineti-published-061-acceptance/${{ matrix.key }}/npm-installed-inventory.json
            ${{ runner.temp }}/kineti-published-061-acceptance/${{ matrix.key }}/acceptance-evidence/*.stdout
            ${{ runner.temp }}/kineti-published-061-acceptance/${{ matrix.key }}/acceptance-evidence/*.stderr
            .kineti/published-061/packages/registry-metadata.json
            .kineti/published-061/packages/SHA256SUMS.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1
