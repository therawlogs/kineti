name: Tool Request (CLI / MCP)
description: Propose a new governance tool for bin/ or an MCP tool for agent harnesses
title: "[Tool]: "
labels: ["tool-proposal"]
body:
  - type: markdown
    attributes:
      value: |
        Use this template to propose a new command line tool for `bin/` or a new tool for the MCP server (`bin/kineti-mcp.ts`).
        All Kineti tools must follow core rules: plain words output, numbered choices (1, 2, 3), audit logging, and fail-closed safety.

  - type: input
    id: tool-name
    attributes:
      label: Tool Name
      description: Proposed file name or tool identifier (e.g. `bin/kineti-audit.ts` or `mcp_verify_state`).
      placeholder: bin/kineti-<name>.ts
    validations:
      required: true

  - type: textarea
    id: tool-purpose
    attributes:
      label: Purpose and Functionality
      description: What does this tool do? Describe its role in plain English.
      placeholder: Explain what problem this tool solves and who executes it (user, agent, or CI).
    validations:
      required: true

  - type: textarea
    id: inputs-and-arguments
    attributes:
      label: Inputs and Arguments
      description: What arguments, flags, or JSON input schemas does this tool accept?
      placeholder: |
        --flag <value>: explanation
        --json: optional machine-readable output
    validations:
      required: true

  - type: textarea
    id: output-format
    attributes:
      label: Output Format
      description: How does the tool present results? Must support plain words and numbered choices (1, 2, 3).
      placeholder: Describe the terminal output format.
    validations:
      required: true

  - type: textarea
    id: undo-inverse-command
    attributes:
      label: Undo Safety Inverse Command
      description: If this tool modifies files, state, or external resources, what is the exact inverse command registered with `bin/kineti-saga.ts`?
      placeholder: If read-only, write 'N/A (Read-only)'. If mutating, specify the exact undo command.
    validations:
      required: true

  - type: dropdown
    id: safety-tier
    attributes:
      label: Safety Tier
      description: Select the safety classification for this tool.
      options:
        - "1. Read-only (inspects files or state without side effects)"
        - "2. Local mutation (modifies project files, protected by saga rollback)"
        - "3. Network egress (outbound network requests, requires egress logging)"
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Tool Standards Checklist
      options:
        - label: The tool fails closed (bad input exits non-zero, never disabling safety checks).
          required: true
        - label: The tool will never print secrets, passwords, or raw tokens to terminal or log files.
          required: true
        - label: Unit tests can run with mocked filesystem directories without requiring live cloud services.
          required: true
