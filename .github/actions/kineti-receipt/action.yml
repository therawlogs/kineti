name: "Kineti receipt"
description: "Offline ship gate — fails if evidence missing, stale, or chain broken. No server required."
branding:
  icon: shield
  color: green
inputs:
  verify-command:
    description: 'Verification command that evidence binds to — any agent (e.g. "cargo test" | "pytest" | "npm test" | "./verify.sh"). If set, runs evidence before check. Legacy alias for `proof-command`.'
    required: false
    default: ""
  proof-command:
    description: 'Alias for verify-command — preferred key for any-agent verification (e.g. "pytest"). If both set, verify-command wins.'
    required: false
    default: ""
  install:
    description: "Install kineti binary if not on PATH (uses getkineti.com/install.sh)"
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - name: install kineti
      if: inputs.install == 'true'
      shell: bash
      run: |
        if ! command -v kineti >/dev/null 2>&1; then
          curl -fsSL https://getkineti.com/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
        fi
        kineti --version
    - name: evidence (optional)
      if: inputs.verify-command != '' || inputs.proof-command != ''
      shell: bash
      run: |
        CMD="${{ inputs.verify-command }}"
        if [ -z "$CMD" ]; then CMD="${{ inputs.proof-command }}"; fi
        echo "→ kineti evidence --cmd $CMD"
        kineti evidence --cmd "$CMD"
    - name: ship-check (stale/missing → fail)
      shell: bash
      run: |
        echo "→ kineti ship-check"
        kineti ship-check
        echo "✔ proofs fresh"
    - name: verify chain (offline)
      shell: bash
      run: |
        echo "→ kineti verify --all"
        kineti verify --all
        echo "✔ chain clean"
    - name: receipt
      shell: bash
      run: kineti receipt
