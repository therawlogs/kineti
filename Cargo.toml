[package]
name = "kineti"
version = "0.2.0"
edition = "2021"
description = "Ship proof + spend fuse for any agent — gateway meter and merge stamp"
license = "Apache-2.0"
repository = "https://github.com/therawlogs/kineti"
homepage = "https://www.getkineti.com"
readme = "README.md"
keywords = ["agent", "ci", "receipt", "devtools"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["demo/", "dist/", "target/"]

# rlib: normal Rust linking (bin, tests) ·
# cdylib: Phase 9 C-ABI surface (kineti_run / kineti_verify / kineti_receipt)
[lib]
name = "kineti"
crate-type = ["rlib", "cdylib"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
sha2 = "0.10"
toml = "0.8"
regex = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "z"
# panic = "unwind" (default) is REQUIRED: swarm workers isolate panics via
# catch_unwind; abort would kill the whole process and every sibling worker.
