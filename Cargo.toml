[package]
name = "kineti"
version = "0.1.0"
edition = "2021"
description = "Agent harness — context integrity, mechanical governance, chained memory"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
sha2 = "0.10"
toml = "0.8"
dirs = "5"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "z"
panic = "abort"
